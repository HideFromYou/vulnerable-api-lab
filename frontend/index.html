<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Inc. User Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🔎 Mystery Inc. User Portal</h1>
        <p>Welcome to the Mystery Inc. investigation system.</p>
    </header>

    <main>
        <section id="login-section">
            <h2>Login</h2>

            <form id="login-form">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p id="login-message"></p>
        </section>

        <section id="users-section">
            <h2>User Case Files</h2>

            <button id="load-users">
                Load Users
            </button>

            <div id="users-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
